services:
  care-landing:
    image: nginx:1.27-alpine
    container_name: care-landing
    restart: unless-stopped
    volumes:
      - ./landing:/usr/share/nginx/html/:ro
      - ./branding:/usr/share/nginx/html/branding/:ro
      - ./dummy:/usr/share/nginx/html/dummy/:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.care.rule=Host(`care.wir.ooo`)"
      - "traefik.http.routers.care.entrypoints=websecure"
      - "traefik.http.routers.care.tls.certresolver=letsencrypt"
      - "traefik.http.services.care.loadbalancer.server.port=80"
    networks:
      - traefik-public

networks:
  traefik-public:
    external: true
