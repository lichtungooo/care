# care.wir.ooo — Landing-Instanz auf Timos NixOS-Server.
#
# Statische Landing als Nginx. Traefik holt Zertifikat, sobald der DNS
# von care.wir.ooo auf diesen Server (85.214.196.122) zeigt.
# Muster uebernommen von ~/apps/wir-ooo/ (trustdonation-Landing).
#
# Start:  docker compose up -d

services:
  landing:
    image: nginx:1.27-alpine
    container_name: care-landing
    network_mode: bridge
    restart: unless-stopped
    volumes:
      - ./landing:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.care.rule=Host(`care.wir.ooo`)"
      - "traefik.http.routers.care.entrypoints=websecure"
      - "traefik.http.routers.care.tls.certresolver=letsencrypt"
      - "traefik.http.services.care.loadbalancer.server.port=80"
      - "com.centurylinklabs.watchtower.enable=false"
